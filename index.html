<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="アプリ＋">
<title>アプリ＋</title>
<style>
*, *::before, *::after {
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
}

:root{color-scheme:dark;--bg:#000000;--panel:#161b23;--line:#2a3140;--text:#e6ebf3;--muted:#8b96a9;--accent:#4d8df7}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;overscroll-behavior-x:none;-webkit-text-size-adjust:100%;touch-action:pan-y}
body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body.booting #stage{visibility:hidden}

/* 回転中は全transition/animationを停止して合成のちらつきを抑止 */
html.rotating *, html.rotating *::before, html.rotating *::after{
  transition: none !important;
  animation: none !important;
}

button,input,textarea{font:inherit;font-size:16px}
button{border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:44px;background:#1b212b;color:var(--text);font-weight:650;-webkit-tap-highlight-color:transparent}
button:active{background:#242c3a}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:active{background:#3f7ce0}
button.danger{color:#ff9aa8;background:#2a161c;border-color:#4d2530}
input[type=text],textarea{width:100%;max-width:100%;min-width:0;border:1px solid var(--line);border-radius:11px;padding:12px;background:#0d1015;color:var(--text);font-size:16px!important;line-height:1.5;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;touch-action:pan-y}
input::placeholder,textarea::placeholder{color:#5a6478}
textarea{resize:vertical}

/* will-change/backface-visibilityは横画面回転でセーフエリアの
   1フレーム遅延を招くため削除 */
#app{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:var(--bg);z-index:1;transition:background-color .2s}

#stage{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:10;touch-action:pan-y}
.card{max-width:560px;width:100%;margin:0 auto 14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 28px #00000055}
h1{font-size:21px;margin:0}h2{font-size:15px;margin:0}p,.hint{font-size:13px;line-height:1.6;color:var(--muted);margin:0}
.setup-head{max-width:560px;width:100%;margin:0 auto 14px;padding:0 4px}
.setup-head .subtitle{margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.5;font-weight:400}

.step-label{font-size:16px;font-weight:650;color:var(--text);line-height:1.6}
.step{margin:0;font-size:16px;font-weight:650;color:var(--text);line-height:1.6}
.share-step{display:flex;align-items:center;gap:.4em}
.share-icon{width:1.5em;height:1.5em;flex:none;color:var(--text);display:block}

.btn-share{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
.btn-share svg{width:1.25em;height:1.25em;flex:none;display:block}

.title-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.title-row h1,.title-row h2{flex:1;min-width:0}
.title-row .count{flex:none;text-align:right}

.app-setting{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0 4px}
#iconPreview{width:104px;height:104px;aspect-ratio:1/1;object-fit:cover;border-radius:24px;border:1px solid var(--line);background:#0d1015;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,opacity .15s;box-shadow:0 6px 20px #00000066}
#iconPreview:active{border-color:var(--accent);opacity:.85}
#setupName{max-width:280px;text-align:center;padding:10px 14px;border-radius:12px}
#htmlSetup{height:40vh;min-height:220px;font-family:ui-monospace,monospace;font-size:16px;line-height:1.45}

#runtime{position:absolute;inset:0;display:none;background:var(--bg);z-index:5;transition:background-color .2s;touch-action:auto}
#runner{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent;touch-action:auto}

#edge{position:absolute;z-index:20;right:0;top:calc(50% - 60px);width:16px;height:120px;min-height:0;padding:0;border:0;border-radius:0;background:transparent;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
#edge::before{content:"";position:absolute;right:0;top:12px;bottom:12px;width:3px;border-radius:3px 0 0 3px;background:#ffffff1f;transition:width .18s,background .18s}
#edge.pull::before,#edge:active::before{width:5px;background:#4d8df7b3}

#drawer{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;transform:translateX(102%);transition:transform .23s}
#drawer.open{transform:translateX(0)}
#head{flex:none;display:flex;justify-content:space-between;align-items:center;padding:calc(9px + env(safe-area-inset-top,0px)) 14px 9px;background:#11151b;border-bottom:1px solid var(--line)}
#head strong{font-size:17px}#close{min-height:38px;padding:7px 14px;font-size:17px;line-height:1}
#tabs{flex:none;display:flex;gap:5px;padding:8px;background:#11151b;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:0;white-space:nowrap;font-size:12px;padding:8px 5px;min-height:40px}
.tab.active{background:#17263f;color:#a9c8ff;border-color:#2f4f86}
#panels{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 12px calc(20px + env(safe-area-inset-bottom,0px));touch-action:pan-y}
.panel{display:none;max-width:650px;width:100%;margin:auto;flex-direction:column;gap:12px}
.panel.active{display:flex}
.section{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:0}

.memo-list{display:flex;flex-direction:column;gap:6px}
.memo-item{display:flex;align-items:flex-start;gap:8px;background:#0d1015;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.memo-check{flex:none;width:22px;height:22px;margin:3px 0 0;accent-color:var(--accent);cursor:pointer;touch-action:manipulation}
.memo-text{flex:1;min-width:0;border:0;background:transparent;padding:2px 0;color:var(--text);font-size:16px;font-family:inherit;resize:none;overflow:hidden;line-height:1.5;min-height:1.5em;-webkit-user-select:text;user-select:text;touch-action:pan-y}
.memo-text:focus{outline:none}
.memo-del{flex:none;min-height:0;width:28px;height:28px;padding:0;border-radius:50%;background:transparent;border:0;color:var(--muted);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;align-self:center;touch-action:manipulation}
.memo-del:active{background:#2a161c;color:#ff9aa8}
.memo-empty{color:var(--muted);font-size:13px;padding:12px;text-align:center;background:#0d1015;border:1px dashed var(--line);border-radius:10px}

.btns4 button{padding-left:4px;padding-right:4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns3 button{padding-left:4px;padding-right:4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#splitPanel{display:flex;flex-direction:column;gap:8px}
.split-btn.active{background:#17263f;color:#a9c8ff;border-color:#2f4f86}

#htmlCode{height:36vh;min-height:230px;max-height:58vh;font-family:ui-monospace,monospace;font-size:16px;line-height:1.45}
.count{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
#storageBar{height:9px;border-radius:9px;background:#212a38;overflow:hidden}
#storageFill{height:100%;width:0;background:var(--accent);transition:width .3s}
#shade{position:absolute;inset:0;z-index:30;background:#00000066;display:none}
#shade.show{display:block}
#toast{position:absolute;z-index:60;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#e6ebf3;color:#10141a;padding:10px 15px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
[hidden]{display:none!important}</style></head><body class="booting">
<div id="app">
<div id="stage">
<div id="setup">
<header class="setup-head">
<h1>アプリ＋</h1>
<p class="subtitle">作成したHTMLをアプリ化できます</p>
</header>
<section class="card">
<label class="step-label">① アプリ設定</label>
<div class="app-setting">
<img id="iconPreview" alt="アイコン" role="button" tabindex="0" aria-label="アイコン画像を選択">

</div>
</section>
<section class="card"><p class="step share-step"><span>②</span><svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 6l-4-4-4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 2v13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>を選択して「ホーム画面に追加」</span></p></section>

<div id="panels">
<section class="panel active" id="memoPanel">

</div>

</div>
</div>
</section>
<section class="panel" id="htmlPanel">

<textarea id="htmlCode" spellcheck="false" placeholder="HTMLコード"></textarea>

<button id="pasteHtml">貼付</button>

</div>

<button id="export">バックアップ</button>
</div>
</div>

</section>
</div></aside>
<button id="edge" aria-label="管理画面を開く"></button>
<div id="toast"></div>
</div>
<script>
(()=>{'use strict';
const DB='html-app-manager-v2',STORE='s',KEY='main',$=id=>document.getElementById(id);

const mq=window.matchMedia;
const standalone=(mq&&(mq('(display-mode: standalone)').matches||mq('(display-mode: fullscreen)').matches||mq('(display-mode: minimal-ui)').matches||mq('(display-mode: window-controls-overlay)').matches))||navigator.standalone===true;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){if(e.cancelable)e.preventDefault()},{passive:false})});

document.addEventListener('dragover',function(e){if(e.cancelable)e.preventDefault()},false);
document.addEventListener('drop',function(e){if(e.cancelable)e.preventDefault()},false);

let edgeStartX=null,edgeStartY=null;
document.addEventListener('touchstart',function(e){
  if(e.touches.length===1){edgeStartX=e.touches[0].clientX;edgeStartY=e.touches[0].clientY}
  else{edgeStartX=null;edgeStartY=null}
},{passive:true});

document.addEventListener('touchmove',function(e){
  if(e.touches.length>1){if(e.cancelable)e.preventDefault();return}
  if(edgeStartX===null)return;
  const dx=e.touches[0].clientX-edgeStartX;
  const dy=e.touches[0].clientY-edgeStartY;
  if(Math.abs(dx)<=Math.abs(dy))return;
  const EDGE=30;
  const w=window.innerWidth||document.documentElement.clientWidth;
  if(edgeStartX<EDGE&&dx>0){if(e.cancelable)e.preventDefault();return}
  if(edgeStartX>w-EDGE&&dx<0){if(e.cancelable)e.preventDefault();return}
},{passive:false});

let lastTapEnd=0;
document.addEventListener('touchend',function(e){
  const now=Date.now();const editing=e.target&&e.target.closest&&e.target.closest('input,textarea');
  if(now-lastTapEnd<=320&&!editing&&e.cancelable)e.preventDefault();
  lastTapEnd=now;
  edgeStartX=null;edgeStartY=null;
},{passive:false});

/* ============================================================
   画面回転対策（縦横共通）
   ============================================================ */
let rotRafId=null;
let rotEndTimer=null;
let lastOrientation=(window.innerWidth>window.innerHeight)?'landscape':'portrait';
const SAI_SIDES=['top','right','bottom','left'];

const probe=document.createElement('div');
probe.setAttribute('aria-hidden','true');
probe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;'
  +'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(probe);

function readSai(){
  let cs;
  try{cs=getComputedStyle(probe)}catch(e){return {top:'0px',right:'0px',bottom:'0px',left:'0px'}}
  return {top:cs.paddingTop||'0px',right:cs.paddingRight||'0px',bottom:cs.paddingBottom||'0px',left:cs.paddingLeft||'0px'};
}
function saiCss(v){
  return ':root{--app-sai-top:'+v.top+';--app-sai-right:'+v.right+';--app-sai-bottom:'+v.bottom+';--app-sai-left:'+v.left+'}';
}
function syncSai(){
  try{
    const runner=$('runner');
    const doc=runner&&runner.contentDocument;
    if(!doc||!doc.documentElement)return;
    const v=readSai(),st=doc.documentElement.style;
    for(let i=0;i<SAI_SIDES.length;i++){
      const k=SAI_SIDES[i],name='--app-sai-'+k;
      if(st.getPropertyValue(name)!==v[k])st.setProperty(name,v[k]);
    }
  }catch(e){}
}
function rewriteEnv(html){
  return String(html).replace(/env\(\s*safe-area-inset-(top|right|bottom|left)\s*(?:,\s*([^()]*?))?\s*\)/gi,function(m,side,fb){
    return 'var(--app-sai-'+side.toLowerCase()+','+((fb&&fb.trim())||'0px')+')';
  });
}
function buildSrcdoc(html){
  const out=rewriteEnv(html);
  const tag='<style id="__app_plus_sai">'+saiCss(readSai())+'</style>';
  if(/<head(?:\s[^>]*)?>/i.test(out))return out.replace(/<head(?:\s[^>]*)?>/i,function(m){return m+tag});
  if(/<html(?:\s[^>]*)?>/i.test(out))return out.replace(/<html(?:\s[^>]*)?>/i,function(m){return m+tag});
  return out;
}

function clearRotTimers(){
  if(rotRafId){cancelAnimationFrame(rotRafId);rotRafId=null}
  if(rotEndTimer){clearTimeout(rotEndTimer);rotEndTimer=null}
}

function resetScrollPositions(){
  try{window.scrollTo(0,0)}catch(e){}
  const d=document.documentElement,b=document.body;
  if(d.scrollTop)d.scrollTop=0;
  if(d.scrollLeft)d.scrollLeft=0;
  if(b.scrollTop)b.scrollTop=0;
  if(b.scrollLeft)b.scrollLeft=0;
  const stage=$('stage');
  if(stage&&stage.scrollTop)stage.scrollTop=0;
  try{
    const runner=$('runner');
    if(runner&&runner.contentWindow){
      const cw=runner.contentWindow;
      if(cw.scrollX||cw.scrollY)cw.scrollTo(0,0);
      const cd=runner.contentDocument;
      if(cd){
        if(cd.documentElement){
          if(cd.documentElement.scrollTop)cd.documentElement.scrollTop=0;
          if(cd.documentElement.scrollLeft)cd.documentElement.scrollLeft=0;
        }
        if(cd.body){
          if(cd.body.scrollTop)cd.body.scrollTop=0;
          if(cd.body.scrollLeft)cd.body.scrollLeft=0;
        }
      }
    }
  }catch(e){}
}

function scheduleViewportFix(){
  clearRotTimers();
  const html=document.documentElement;
  html.classList.add('rotating');
  const t0=performance.now();
  function loop(){
    resetScrollPositions();
    syncSai();
    if(performance.now()-t0<800){
      rotRafId=requestAnimationFrame(loop);
    }else{
      rotRafId=null;
      html.classList.remove('rotating');
    }
  }
  loop();
}

window.addEventListener('orientationchange',scheduleViewportFix,{passive:true});
if(window.screen&&screen.orientation&&screen.orientation.addEventListener){
  screen.orientation.addEventListener('change',scheduleViewportFix,{passive:true});
}
window.addEventListener('resize',function(){
  resetScrollPositions();
  syncSai();
  const o=(window.innerWidth>window.innerHeight)?'landscape':'portrait';
  if(o!==lastOrientation){lastOrientation=o;scheduleViewportFix()}
},{passive:true});
window.addEventListener('pageshow',function(){setTimeout(function(){resetScrollPositions();syncSai()},0)});

/* ===== キーボード表示時の入力欄可視化 ===== */
function isKeyboardOpen(){
  const vv=window.visualViewport;
  if(!vv)return false;
  return (window.innerHeight-vv.height)>120;
}
function keepActiveVisible(){
  const el=document.activeElement;
  if(!el)return;
  const tag=el.tagName;
  if(tag!=='TEXTAREA'&&tag!=='INPUT')return;
  if(!$('drawer').classList.contains('open'))return;
  const vv=window.visualViewport;
  if(!vv)return;
  const m=16;
  const top=vv.offsetTop+m;
  const bottom=vv.offsetTop+vv.height-m;
  const r=el.getBoundingClientRect();
  const panels=$('panels');
  if(r.bottom>bottom){
    panels.scrollTop+=(r.bottom-bottom);
  }else if(r.top<top){
    panels.scrollTop-=(top-r.top);
  }
}

if(window.visualViewport){
  window.visualViewport.addEventListener('resize',function(){
    const vv=window.visualViewport;
    if(vv&&Math.abs(vv.scale-1)>0.02)return;
    if(isKeyboardOpen()){keepActiveVisible();return}
    resetScrollPositions();
    syncSai();
  },{passive:true});
  window.visualViewport.addEventListener('scroll',function(){
    if(isKeyboardOpen())keepActiveVisible();
  },{passive:true});
}

if(window.ResizeObserver){
  try{
    const ro=new ResizeObserver(function(){resetScrollPositions();syncSai()});
    ro.observe($('runner'));
  }catch(e){}
}

setTimeout(()=>document.body.classList.remove('booting'),1500);

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function generateDefaultIcon(){
  const S=512,c=document.createElement('canvas');c.width=c.height=S;
  const ctx=c.getContext('2d');
  const R=Math.round(S*0.2237);
  roundRectPath(ctx,0,0,S,S,R);
  ctx.save();
  ctx.clip();
  const bg=ctx.createLinearGradient(0,0,0,S);
  bg.addColorStop(0,'#1a1a1c');
  bg.addColorStop(0.5,'#0c0c0e');
  bg.addColorStop(1,'#000000');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,S,S);
  const rad=ctx.createRadialGradient(S*0.3,S*0.25,0,S*0.3,S*0.25,S*0.9);
  rad.addColorStop(0,'rgba(255,255,255,0.06)');
  rad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=rad;
  ctx.fillRect(0,0,S,S);
  const PAD=S*0.105;
  const GAP=S*0.052;
  const TILE=(S - PAD*2 - GAP*2)/3;
  const TR=TILE*0.235;
  const pattern=[[0,1,0],[1,1,1],[0,1,0]];
  for(let row=0;row<3;row++){
    for(let col=0;col<3;col++){
      const x=PAD+col*(TILE+GAP);
      const y=PAD+row*(TILE+GAP);
      const isPlus=pattern[row][col]===1;
      ctx.save();
      ctx.shadowColor=isPlus?'rgba(160,190,255,0.18)':'rgba(0,0,0,0.5)';
      ctx.shadowBlur=S*0.02;
      ctx.shadowOffsetY=S*0.008;
      roundRectPath(ctx,x,y,TILE,TILE,TR);
      const tg=ctx.createLinearGradient(x,y,x,y+TILE);
      if(isPlus){
        tg.addColorStop(0,'#ffffff');
        tg.addColorStop(0.5,'#f5f6f8');
        tg.addColorStop(1,'#e0e3e8');
      }else{
        tg.addColorStop(0,'#7c8088');
        tg.addColorStop(0.5,'#5a5f67');
        tg.addColorStop(1,'#3c4047');
      }
      ctx.fillStyle=tg;
      ctx.fill();
      ctx.restore();
      ctx.save();
      roundRectPath(ctx,x,y,TILE,TILE,TR);
      ctx.clip();
      const hl=ctx.createLinearGradient(x,y,x,y+TILE*0.5);
      hl.addColorStop(0,isPlus?'rgba(255,255,255,0.55)':'rgba(255,255,255,0.30)');
      hl.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=hl;
      ctx.fillRect(x,y,TILE,TILE*0.5);
      const bs=ctx.createLinearGradient(x,y+TILE*0.6,x,y+TILE);
      bs.addColorStop(0,'rgba(0,0,0,0)');
      bs.addColorStop(1,isPlus?'rgba(0,0,0,0.14)':'rgba(0,0,0,0.34)');
      ctx.fillStyle=bs;
      ctx.fillRect(x,y+TILE*0.6,TILE,TILE*0.4);
      ctx.restore();
    }
  }
  ctx.restore();
  return c.toDataURL('image/png');
}

let memoItems = [];

function normalizeMemoText(v){
  return String(v==null?'':v).replace(/^[\s\u3000・•･]+/,'').replace(/[\s\u3000]+$/,'');
}

function loadMemoItems(){
  const text = s.memo || '';
  if (!text.trim()) { memoItems = []; return; }
  const lines = text.split('\n');
  const checks = Array.isArray(s.memoChecked) ? s.memoChecked : [];
  memoItems = lines.map(function(line, i){
    return { text: normalizeMemoText(line), checked: !!checks[i] };
  });
}

function saveMemoItemsNow(){
  s.memo = memoItems.map(function(it){ return '・' + it.text; }).join('\n');
  s.memoChecked = memoItems.map(function(it){ return !!it.checked; });
  return put();
}

function saveMemoItemsSoon(){
  clearTimeout(memoTimer);
  memoTimer = setTimeout(function(){
    saveMemoItemsNow().catch(function(){ toast('メモを保存できませんでした'); });
  }, 500);
}

function updateMemoCount(){
  const len = memoItems.reduce(function(sum, it){ return sum + Array.from(it.text).length; }, 0);
  $('memoCount').textContent = len.toLocaleString() + ' / 10,000文字';
}

function resizeMemoText(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 220) + 'px';
}

function createMemoRow(item, idx){
  const row = document.createElement('div');
  row.className = 'memo-item';

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'memo-check';
  cb.checked = !!item.checked;
  cb.addEventListener('change', function(){
    item.checked = cb.checked;
    saveMemoItemsSoon();
  });

  const ta = document.createElement('textarea');
  ta.className = 'memo-text';
  ta.rows = 1;
  ta.value = item.text;
  ta.placeholder = '改善点を入力';
  ta.spellcheck = false;
  ta.addEventListener('focus', function(){
    setTimeout(keepActiveVisible, 250);
  });
  ta.addEventListener('input', function(){
    item.text = ta.value;
    const total = memoItems.reduce(function(sum, it){ return sum + Array.from(it.text).length; }, 0);
    if (total > 10000) {
      const excess = total - 10000;
      const chars = Array.from(ta.value);
      ta.value = excess >= chars.length ? '' : chars.slice(0, chars.length - excess).join('');
      item.text = ta.value;
      toast('最大10,000文字です');
    }
    resizeMemoText(ta);
    updateMemoCount();
    saveMemoItemsSoon();
    keepActiveVisible();
  });
  ta.addEventListener('keydown', function(e){
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      memoItems.splice(idx + 1, 0, { text: '', checked: false });
      saveMemoItemsSoon();
      renderMemoList(idx + 1);
    } else if (e.key === 'Backspace' && ta.value === '') {
      e.preventDefault();
      memoItems.splice(idx, 1);
      saveMemoItemsSoon();
      renderMemoList(Math.max(0, idx - 1));
    }
  });
  ta.addEventListener('blur', function(){
    clearTimeout(memoTimer);
    saveMemoItemsNow().catch(function(){ toast('メモを保存できませんでした'); });
  });

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'memo-del';
  del.setAttribute('aria-label', '削除');
  del.textContent = '×';
  del.addEventListener('click', function(){
    memoItems.splice(idx, 1);
    saveMemoItemsSoon();
    renderMemoList();
  });

  row.append(cb, ta, del);
  return row;
}

function renderMemoList(focusIdx){
  const list = $('memoList');
  if (!memoItems.length) {
    memoItems.push({ text: '', checked: false });
    saveMemoItemsSoon();
  }
  list.innerHTML = '';
  memoItems.forEach(function(item, idx){
    list.append(createMemoRow(item, idx));
  });
  requestAnimationFrame(function(){
    list.querySelectorAll('.memo-text').forEach(function(ta){ resizeMemoText(ta); });
  });
  updateMemoCount();
  if (focusIdx !== undefined && focusIdx >= 0 && focusIdx < memoItems.length) {
    const tas = list.querySelectorAll('.memo-text');
    const ta = tas[focusIdx];
    if (ta) {
      ta.focus();
      try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
    }
  }
}

/* ===== HTML 3分割（連続スライス方式・連結で元に完全一致） ===== */
function computeSplits(html){
  const src = String(html||'');
  const len = src.length;
  if(!len) return {p1:'', p2:'', p3:'', mode:'empty'};

  let lastStyleEnd = -1;
  let m;
  const styleRe = /<\/style\s*>/gi;
  while((m = styleRe.exec(src)) !== null){
    lastStyleEnd = m.index + m[0].length;
  }

  let firstScriptStart = -1;
  if(lastStyleEnd >= 0){
    const scriptRe = /<script\b([^>]*)>/gi;
    scriptRe.lastIndex = Math.max(0, lastStyleEnd);
    while((m = scriptRe.exec(src)) !== null){
      const attrs = m[1] || '';
      if(/\bsrc\s*=/i.test(attrs)) continue;
      firstScriptStart = m.index;
      break;
    }
  }

  let c1, c2, mode;

  if(lastStyleEnd > 0 && firstScriptStart > lastStyleEnd && firstScriptStart < len){
    c1 = lastStyleEnd;
    c2 = firstScriptStart;
    mode = 'natural';
  }
  else if(lastStyleEnd > 0 && lastStyleEnd < len - 1){
    c1 = lastStyleEnd;
    c2 = lastStyleEnd + Math.floor((len - lastStyleEnd) / 2);
    mode = 'css-only';
  }
  else if(firstScriptStart > 1 && firstScriptStart < len){
    c1 = Math.floor(firstScriptStart / 2);
    c2 = firstScriptStart;
    mode = 'js-only';
  }
  else{
    c1 = Math.floor(len / 3);
    c2 = Math.floor(len * 2 / 3);
    mode = 'even';
  }

  if(c1 < 0) c1 = 0;
  if(c2 < c1) c2 = c1;
  if(c2 > len) c2 = len;

  return {
    p1: src.slice(0, c1),
    p2: src.slice(c1, c2),
    p3: src.slice(c2),
    mode
  };
}

/* ===== 分割依頼UI（選択式） ===== */
let splitMode = false;
let splitSelected = [true, true, false];
const SPLIT_LABELS = ['1/3', '2/3', '3/3'];

function updateSplitUI(){
  for(let i=0;i<3;i++){
    const btn = $('selPart'+(i+1));
    if(btn) btn.classList.toggle('active', !!splitSelected[i]);

function joinByTo(labels){
  if(labels.length === 0) return '';
  if(labels.length === 1) return labels[0];
  if(labels.length === 2) return labels[0] + 'と' + labels[1];
  return labels.slice(0,-1).join('、') + 'と' + labels[labels.length-1];
}

async function shareSplitSelected(){
  const src = s.html || $('htmlCode').value;
  if(!src || !src.trim()){toast('HTMLがありません');return}

  const selectedIdx = [];
  for(let i=0;i<3;i++) if(splitSelected[i]) selectedIdx.push(i);
  if(!selectedIdx.length){toast('送信するパートを選択してください');return}

  const sp = computeSplits(src);
  const parts = [sp.p1, sp.p2, sp.p3];
  const selectedLabels = selectedIdx.map(i=>SPLIT_LABELS[i]);
  const nonSelectedIdx = [0,1,2].filter(i=>!splitSelected[i]);
  const nonSelectedLabels = nonSelectedIdx.map(i=>SPLIT_LABELS[i]);

  // プロンプトにはコードを含めない（ファイル添付のみ）
  let prompt = '';
  if(selectedIdx.length === 3){
    prompt += 'HTMLを3分割した1/3、2/3、3/3のファイルを添付しました。3つを連結すると1つの完全なHTMLになります。\n';
    prompt += '以下の修正を実施して、全コードを1つのHTMLとして提供してください。\n\n';
  }else{
    prompt += 'HTMLを3分割したファイルのうち、'+joinByTo(selectedLabels)+'を添付しました。';
    prompt += 'この後、'+joinByTo(nonSelectedLabels)+'を送信しますので、全部揃うまでは思考や回答をせず、全部揃ってから全コードを以下のとおりに修正して1つのHTMLとして提供してください。\n\n';
    prompt += '※添付した'+joinByTo(selectedLabels)+'と後で送信する'+joinByTo(nonSelectedLabels)+'を連結すると1つの完全なHTMLになります。\n\n';
  }
  prompt += '【修正内容】\n' + (memoTextForAI() || '（メモなし）') + '\n';

  try{ await navigator.clipboard.writeText(prompt); }
  catch{ toast('コピーできませんでした'); return; }

  const base = sanitizeName(s.name||'アプリ＋');
  const files = [];
  try{
    selectedIdx.forEach(i=>{
      files.push(new File([parts[i]], base+'_'+(i+1)+'of3.txt', {type:'text/plain'}));
    });
  }catch(e){}

  try{
    if(navigator.share){
      const data = { title:'HTML改善依頼（分割）', text: prompt };
      if(files.length && navigator.canShare && navigator.canShare({files})) data.files = files;
      await navigator.share(data);
      toast('共有画面を開きました');
    }else{
      files.forEach(f=>download(f,f.name));
      toast('依頼文をコピーしファイルを保存しました');
    }
  }catch(e){
    if(e.name !== 'AbortError') toast('共有に失敗しました。依頼文はコピー済みです');
  }

  /* 未送信パートにコピーボタンを出現 */
  const copyRow = $('splitCopyRow');
  copyRow.innerHTML = '';
  if(nonSelectedIdx.length){
    nonSelectedIdx.forEach(i=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = SPLIT_LABELS[i]+'をコピー';
      btn.addEventListener('click', function(){
        copyText(parts[i], SPLIT_LABELS[i]+'をコピーしました');
      });
      copyRow.appendChild(btn);
    });
    copyRow.hidden = false;
  }else{
    copyRow.hidden = true;
  }
}

function extractTitle(html){
  const m=String(html||'').match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  if(!m)return '';

}

async function exportBackup(){
  const title=extractTitle(s.html)||(s.name||'アプリ＋');
  const filename=`${sanitizeName(title)}（アプリ＋バックアップ）.json`;
  const app={html:s.html,previousHtml:s.previousHtml,memo:s.memo,memoChecked:s.memoChecked};
  const o={format:'html-app-manager-backup',version:2,exportedAt:new Date().toISOString(),app,localStorage:localData(),limitations:['HTML側IndexedDBは汎用バックアップ対象外','localStorageは同一オリジンで参照できる範囲','アプリ名・アイコンは保存対象外']};
  download(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),filename);
  s.lastBackupAt=new Date().toISOString();
  s.lastBackupSize=appBytes();
  try{await put()}catch(e){}
  backupInfo();
  toast('バックアップを書き出しました');
}
async function importBackup(f){try{let o=JSON.parse(await f.text());if(o.format!=='html-app-manager-backup'||!o.app||typeof o.app.html!=='string')throw Error('対応していないファイルです');if(!confirm('現在の内容を上書きして復元しますか？'))return;
  s.html=o.app.html||'';s.previousHtml=o.app.previousHtml||'';s.memo=o.app.memo||'';s.memoChecked=Array.isArray(o.app.memoChecked)?o.app.memoChecked:[];
  await put();
  if(o.localStorage&&confirm('バックアップ内のlocalStorageも復元しますか？'))for(let[k,v]of Object.entries(o.localStorage))if(typeof v==='string')localStorage.setItem(k,v);
  render();toast('復元しました。IndexedDBの実行データは対象外です')}catch(e){alert('復元できませんでした：'+e.message)}}

$('edge').addEventListener('pointerdown',function(e){
  edgeState={x:e.clientX,y:e.clientY,t:Date.now(),moved:false};
  ex=edgeState.x;ey=edgeState.y;
  $('edge').classList.add('pull');
});
$('edge').addEventListener('pointermove',function(e){
  if(!edgeState)return;
  if(Math.abs(e.clientX-edgeState.x)>6||Math.abs(e.clientY-edgeState.y)>6)edgeState.moved=true;
});
$('edge').addEventListener('pointerup',function(e){
  if(!edgeState)return;
  const st=edgeState;edgeState=null;ex=null;ey=null;
  $('edge').classList.remove('pull');
  const dx=st.x-e.clientX,dy=st.y-e.clientY;
  const dt=Date.now()-st.t;
  const isTap=!st.moved&&dt<400;
  const isSwipe=dx>20&&Math.abs(dx)>Math.abs(dy)*1.5;
  if(isTap||isSwipe)drawerOpen();
});
$('edge').addEventListener('pointercancel',function(){
  edgeState=null;ex=null;ey=null;$('edge').classList.remove('pull');
});

let swipe=null;
$('drawer').addEventListener('touchstart',e=>{if(e.touches.length===1)swipe={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
$('drawer').addEventListener('touchend',e=>{if(!swipe)return;let dx=e.changedTouches[0].clientX-swipe.x,dy=e.changedTouches[0].clientY-swipe.y;if(dx>75&&Math.abs(dx)>Math.abs(dy))drawerClose();swipe=null},{passive:true});

})();
